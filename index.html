<!DOCTYPE html>
<html>
<body>
<table id="myTable" border="1">
  <tr>
    <th>ID</th>
    <th>Name</th>
  </tr>
</table>

<script>
fetch("data.json")
  .then(response => response.json())
  .then(data => {
    var html = '';
    data.forEach(item => {
      html += `ID: ${item.ID}, Name: ${item.Name}<br>`;
    });
    document.getElementById("showData").innerHTML = html;
  })
  .catch(error => console.error('Error:', error));
</script>
</body>
</html>
