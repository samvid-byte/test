<!DOCTYPE html>
<html>
<head>
  <title>Fruit List</title>
</head>
<body>
  <h1>Fruit List</h1>
  <div id="showData"></div>

  <script>
    fetch("data.json")
      .then(response => response.json())
      .then(data => {
        var html = '';
        data.forEach(item => {
          html += ID: ${item.ID}, Name: ${item.Name}<br>;
        });
        document.getElementById("showData").innerHTML = html;
      })
      .catch(error => console.error('Error:', error));
  </script>
</body>
</html>
